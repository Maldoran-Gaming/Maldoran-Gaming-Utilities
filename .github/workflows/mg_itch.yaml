# MALDORAN GAMING 2026

## GitHub Actions Workflow for deploying to Itch.io using self-hosted Windows runners

## Ensure you have setup a self-hosted runner in your GitHub organization.
## See https://docs.github.com/en/actions/hosting-your-own-runners/adding-self-hosted-runners

## Ensure you have the following secrets defined in your repository:
### BUTLER_API_KEY - Butler API key with push permission to the target game (see https://itch.io/docs/butler/login.html)
### ITCH_USER - Itch.io username
### ITCH_GAME - Itch.io game slug

## Ensure you have the following variables defined in your repository:
## REPO_URL - URL of the repository containing the Unity project
## BUILD_FOLDER_NAME - Name of the folder where the Unity project is cloned to
## BUILD_PROFILE - Name of the Unity build profile to use
## UNITY_EDITOR_VERSION - Version of Unity Editor to use (e.g., 6000.3.0f1)
## ITCH_CHANNEL - Itch.io channel to deploy to (recommended: "html" for HTML5 builds) (see https://itch.io/docs/butler/pushing.html)

# NOTE: If you are using the basic/free version of GitHub and your repository is private, 
# you will need to specify all of these variables at the repository level instead of the Organisation level. 

name: Build and Deploy to Itch.io (Self-Hosted Windows Local)
on:
  workflow_call:
    inputs:
      REPO_URL:
        required: true
        type: string
      BUILD_FOLDER_NAME:
        required: true
        type: string
      BUILD_PROFILE:
        required: true
        type: string
      UNITY_EDITOR_VERSION:
        required: true
        type: string
      ITCH_CHANNEL:
        required: true
        type: string
    secrets:
      BUTLER_API_KEY:
        required: true
      ITCH_USER:
        required: true
      ITCH_GAME:
        required: true

env:      
  REPO_URL: "${{ inputs.REPO_URL }}"
  WORKING_FOLDER: "C:\\temp\\${{ inputs.BUILD_FOLDER_NAME }}"
  TEMP_PROJECT_PATH: "C:\\temp\\${{ inputs.BUILD_FOLDER_NAME }}\\Project"
  PROJECT_PATH: "C:\\temp\\${{ inputs.BUILD_FOLDER_NAME }}\\Project\\Crylon"
  BUILD_OUTPUT_PATH: "C:\\temp\\${{ inputs.BUILD_FOLDER_NAME }}\\Output-html"
  UNITY_EDITOR_PATH: "C:\\Program Files\\Unity\\Hub\\Editor\\${{ inputs.UNITY_EDITOR_VERSION }}\\Editor\\Unity.exe"
  BUILD_PROFILE_PATH: "Assets\\Settings\\Build Profiles\\${{ inputs.BUILD_PROFILE }}"
  BUTLER_PATH: "C:\\temp\\${{ inputs.BUILD_FOLDER_NAME }}\\BUTLER"
  BUTLER_URL: "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default"

jobs:
  buildWithItchProfile:
    name: Build using Itch.io Build Profile
    runs-on: self-hosted

    
    steps:
      # Ensure the working directory is clean before starting the build
      - name: Clean workspace
        run: |
          echo "=== Starting Workspace Cleanup ==="
          
              if exist "%WORKING_FOLDER%" (
                echo "Found existing folder, attempting to delete..."
                rd /s /q "%WORKING_FOLDER%" || (
                    echo "⚠️ Warning: Some files may be locked. Attempting to continue..."
                )
              )
          
          echo "Creating fresh directories..."
          mkdir "%TEMP_PROJECT_PATH%" || (echo "❌ Failed to create %TEMP_PROJECT_PATH%" && exit /b 1)
          mkdir "%BUILD_OUTPUT_PATH%" || (echo "❌ Failed to create %BUILD_OUTPUT_PATH%" && exit /b 1)
        shell: cmd

      - name: Clone Repository
        run: |
          echo "=== Cloning repository ==="
          git clone --recursive "%REPO_URL%" "%TEMP_PROJECT_PATH%"
          if %errorlevel% neq 0 (
            echo "❌ Failed to clone repository from %REPO_URL%"
            exit /b 1
          )

          cd /d "%TEMP_PROJECT_PATH%"
          if %errorlevel% neq 0 (
            echo "❌ Failed to change directory to %TEMP_PROJECT_PATH%"
            exit /b 1
          )

          echo "✅ Repository cloned successfully"
          echo "Current directory: %CD%"
        shell: cmd

      - name: Verify local project structure
        run: |
          cd /d "%PROJECT_PATH%"
          echo "=== Working from local clone ==="
          echo "Current directory: %CD%"
          echo ""
          echo "=== Verifying Unity project structure ==="

          set "FAILED=0"

          if exist "Assets" (
            echo "✅ Assets folder found"
          ) else (
            echo "❌ Assets folder missing"
            set "FAILED=1"
          )

          if exist "ProjectSettings" (
            echo "✅ ProjectSettings folder found"
          ) else (
            echo "❌ ProjectSettings folder missing"
            set "FAILED=1"
          )

          if exist "%BUILD_PROFILE_PATH%" (
            echo "✅ Build profile found"
          ) else (
            echo "❌ Build profile missing"
            set "FAILED=1"
          )

          echo ""
          echo "=== Directory contents ==="
          dir

          if %FAILED%==1 (
            echo "❌ Project structure verification failed! Required files or folders are missing."
            exit /b 1
          )
        shell: cmd

      - name: Build Unity project
        # Run the build using the Unity Editor executable. The latest LTS version of Unity is not currently available by default.
        # This workflow uses a version installed on the self-hosted runner.
        run: |
          cd /d "%PROJECT_PATH%"
          echo "=== Starting Unity build ==="
          echo "Project path: %PROJECT_PATH%"
          echo "Build output: %BUILD_OUTPUT_PATH%"
          echo "Build profile: %BUILD_PROFILE_PATH%"
          "%UNITY_EDITOR_PATH%" -batchmode -quit -projectPath "%PROJECT_PATH%" -activeBuildProfile "%BUILD_PROFILE_PATH%" -build "%BUILD_OUTPUT_PATH%" -logFile "%BUILD_OUTPUT_PATH%\build.log"
        shell: cmd

      - name: Show build results and validate
        run: |
          cd /d "%BUILD_OUTPUT_PATH%"
          echo "=== Build Results ==="
          if exist "build.log" (
            echo "BUILD LOG:"
            type "build.log"
          ) else (
            echo "No build log found"
            echo "❌ ERROR: No build log generated or found."
            exit /b 1
          )
          echo ""
          if exist "index.html" (
            echo "Index Found"
          ) else (
            echo "❌ ERROR: No index.html file found. Please check build.log to see if the the build failed"
            exit /b 1
          )
          echo ""
          echo "=== Checking if Unity Build Succeeded ==="
          
          echo ""
          echo "=== Checking build directory ==="
          if exist "%BUILD_OUTPUT_PATH%" (
            echo "✅ Build directory exists"
            echo "Build contents:"
            dir "%BUILD_OUTPUT_PATH%"
          
            echo ""
            echo "=== Validating build output ==="
            dir /b "%BUILD_OUTPUT_PATH%" | findstr /r "." >nul
            if errorlevel 1 (
              echo "❌ ERROR: Build directory is empty! Build failed."
              exit /b 1
            ) else (
              echo "✅ Build directory contains files. Build successful."
            )
          ) else (
            echo "❌ ERROR: No build directory found! Build failed."
            exit /b 1
          )
        shell: cmd

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Build-Itch-Profile
          path: ${{ env.BUILD_OUTPUT_PATH }}\
          retention-days: 14

  deployToItch:
    name: Deploy to Itch.io
    #Deploy to itch.io using Butler API
    runs-on: self-hosted
    needs: buildWithItchProfile

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Build-Itch-Profile
          path: build/
      - name: Prepare Temporary Butler Install Dir
        run: |
          if exist %BUTLER_PATH% (
            echo "✅ Butler install directory exists"
          ) else (
            mkdir "%BUTLER_PATH%"
          )
        shell: cmd

      - name: Download and Install Butler
        # Installs latest stable version of Butler to the temporary directory
        # Using PowerShell to enable execution policy bypass
        shell: powershell -ExecutionPolicy Bypass -Command ". {0}"
        run: |
          try {
              Write-Host "=== Downloading Butler ==="
              $officialButlerUrl = "$env:BUTLER_URL"
              Write-Host "Download URL: $officialButlerUrl"
              Write-Host "Install path: $env:BUTLER_PATH"

              $butlerZipPath = Join-Path $env:BUTLER_PATH "butler.zip"
              Invoke-WebRequest -Uri $officialButlerUrl -OutFile $butlerZipPath -UseBasicParsing

              if (-not (Test-Path $butlerZipPath)) {
                  throw "Butler.zip file not found after download"
              }

              $fileSize = (Get-Item $butlerZipPath).Length
              Write-Host "✅ Butler downloaded successfully ($fileSize bytes)"

              Expand-Archive -Path $butlerZipPath -DestinationPath $env:BUTLER_PATH -Force
              Write-Host "✅ Butler extracted successfully"

              Remove-Item $butlerZipPath -Force
              Write-Host "✅ Cleanup completed"

          } catch {
              Write-Host "❌ Error: $_"
              exit 1
          }
        
      - name: Deploy to Itch.io
        # Upload to itch.io using Butler API
        shell: cmd
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          echo "=== Deploying to Itch.io ==="
          echo "User: ${{ secrets.ITCH_USER }}"
          echo "Game: ${{ secrets.ITCH_GAME }}"
          echo "Channel: ${{ inputs.ITCH_CHANNEL }}"
          echo "Version: itchBuild-${{ github.run_number }}"
          echo "Package: build/"
          dir build/
          "%BUTLER_PATH%\butler.exe" push build/ ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:${{ inputs.ITCH_CHANNEL }} --userversion itchBuild-${{ github.run_number }}          
          if %errorlevel% neq 0 (
                  echo "❌ Failed to upload to itch.io"
                  exit /b 1
          )
          echo "✅ Successfully uploaded to itch.io!"